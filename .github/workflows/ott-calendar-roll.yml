name: ott-calendar-roll

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip commit, deploy, and IndexNow"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: bollyai-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Kolkata
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Healthcheck start
        env:
          HC_URL_OTT: ${{ secrets.HC_URL_OTT }}
        run: scripts/lib/hc_ping.sh "${HC_URL_OTT:-}" start "ott-calendar-roll start" || true

      - name: Regenerate OTT calendar
        run: python3 engine/regen_ott_weekly.py --data-dir data --weeks 2

      - name: Build static site
        run: |
          cd site
          npm ci
          npm run build
          test -d out
          test -s out/index.html
          pages="$(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "pages built: ${pages}"
          test "${pages}" -ge 1

      - name: Commit OTT calendar data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "bollyai-bot"
          git config user.email "bot@bollyai.in"
          git pull --rebase --autostash origin main
          git add data/ott data/_state/changed-urls.json
          git diff --cached --quiet || git commit -m "data: ott calendar roll $(date -u +%FT%TZ)"
          git push origin main

      - name: Deploy Cloudflare Pages
        id: deploy
        if: ${{ github.event.inputs.dry_run != 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=bollyai-in --branch=main --commit-dirty=true

      - name: Retry Cloudflare Pages deploy
        id: deploy_retry
        if: ${{ steps.deploy.outcome == 'failure' && github.event.inputs.dry_run != 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=bollyai-in --branch=main --commit-dirty=true

      - name: Check deploy result
        if: ${{ steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome != 'success' }}
        run: exit 1

      - name: IndexNow delta
        if: ${{ github.event.inputs.dry_run != 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.INDEXNOW_KEY != '' }}
        run: python3 scripts/lib/indexnow_ping.py --delta data/_state/changed-urls.json

      - name: IndexNow dry-run
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: python3 scripts/lib/indexnow_ping.py --delta data/_state/changed-urls.json --dry-run --force --floor-seconds 0

      - name: Healthcheck success
        if: success()
        env:
          HC_URL_OTT: ${{ secrets.HC_URL_OTT }}
        run: scripts/lib/hc_ping.sh "${HC_URL_OTT:-}" success "ott-calendar-roll success" || true

      - name: Healthcheck failure
        if: failure()
        env:
          HC_URL_OTT: ${{ secrets.HC_URL_OTT }}
        run: scripts/lib/hc_ping.sh "${HC_URL_OTT:-}" fail "ott-calendar-roll failure" || true

      - name: Telegram failure alert
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SEVERITY: P3
        run: |
          scripts/lib/tg_alert.sh "BollyAI ott-calendar-roll failed: run ${GITHUB_RUN_ID}" || true
