name: tentpole-live

on:
  schedule:
    - cron: "0 */3 * * 5,6,0,1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip commit, deploy, and IndexNow"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force:
        description: "Run even without data/_state/tentpole-live.json"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: bollyai-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Kolkata
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Healthcheck start
        env:
          HC_URL_TENTPOLE: ${{ secrets.HC_URL_TENTPOLE }}
        run: scripts/lib/hc_ping.sh "${HC_URL_TENTPOLE:-}" start "tentpole-live start" || true

      - name: Pull tentpole live data
        id: tentpole
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          args=(--data-dir data --github-output "$GITHUB_OUTPUT")
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/ops/tentpole_live.py "${args[@]}"

      - name: Detect staleness
        if: ${{ steps.tentpole.outputs.ran == 'true' || github.event.inputs.dry_run == 'true' }}
        run: python3 engine/fetchers/staleness_check.py --sla-hours 26 --emit data/_state/staleness.json

      - name: Build static site
        if: ${{ steps.tentpole.outputs.ran == 'true' || github.event.inputs.dry_run == 'true' }}
        run: |
          cd site
          npm ci
          npm run build
          test -d out
          test -s out/index.html
          pages="$(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "pages built: ${pages}"
          test "${pages}" -ge 1

      - name: Commit tentpole data
        if: ${{ steps.tentpole.outputs.ran == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "bollyai-bot"
          git config user.email "bot@bollyai.in"
          git pull --rebase --autostash origin main
          git add data/
          git diff --cached --quiet || git commit -m "data: tentpole live $(date -u +%FT%TZ)"
          git push origin main

      - name: Deploy Cloudflare Pages
        id: deploy
        if: ${{ steps.tentpole.outputs.ran == 'true' && github.event.inputs.dry_run != 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=bollyai-in --branch=main --commit-dirty=true

      - name: Retry Cloudflare Pages deploy
        id: deploy_retry
        if: ${{ steps.deploy.outcome == 'failure' && steps.tentpole.outputs.ran == 'true' && github.event.inputs.dry_run != 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=bollyai-in --branch=main --commit-dirty=true

      - name: Check deploy result
        if: ${{ steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome != 'success' }}
        run: exit 1

      - name: IndexNow delta
        if: ${{ steps.tentpole.outputs.ran == 'true' && github.event.inputs.dry_run != 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.INDEXNOW_KEY != '' }}
        run: python3 scripts/lib/indexnow_ping.py --delta data/_state/changed-urls.json

      - name: IndexNow dry-run
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: python3 scripts/lib/indexnow_ping.py --delta data/_state/changed-urls.json --dry-run --force --floor-seconds 0

      - name: Healthcheck success
        if: success()
        env:
          HC_URL_TENTPOLE: ${{ secrets.HC_URL_TENTPOLE }}
        run: scripts/lib/hc_ping.sh "${HC_URL_TENTPOLE:-}" success "tentpole-live success" || true

      - name: Healthcheck failure
        if: failure()
        env:
          HC_URL_TENTPOLE: ${{ secrets.HC_URL_TENTPOLE }}
        run: scripts/lib/hc_ping.sh "${HC_URL_TENTPOLE:-}" fail "tentpole-live failure" || true

      - name: Telegram failure alert
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SEVERITY: P2
        run: |
          scripts/lib/tg_alert.sh "BollyAI tentpole-live failed: run ${GITHUB_RUN_ID}" || true
